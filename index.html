<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>SPALAM</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        background: #000;
      }
      canvas {
        height: 100svh !important;
        width: 100vw !important;
        object-fit: cover;
      }

      /* 起動画面 */
      #start-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: white;
        z-index: 1000;
      }

      #start-screen h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        letter-spacing: 0.2em;
      }

      #start-screen p {
        font-size: 0.9rem;
        color: #aaa;
        margin-bottom: 2rem;
      }

      #start-button {
        background: #ff3700;
        color: white;
        border: none;
        padding: 18px 48px;
        font-size: 1.2rem;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      #start-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
      }

      #start-button:active {
        transform: translateY(0);
      }

      #start-button:disabled {
        background: #555;
        cursor: not-allowed;
        box-shadow: none;
      }

      #start-status {
        margin-top: 1.5rem;
        font-size: 0.85rem;
        color: #888;
        min-height: 1.5em;
      }

      /* ローディング表示 */
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        text-align: center;
        z-index: 1000;
        display: none;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 2s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* モバイル向けの最適化 */
      @media (max-width: 768px) {
        body {
          -webkit-user-select: none;
          -webkit-touch-callout: none;
          -webkit-tap-highlight-color: transparent;
        }
      }
    </style>
  </head>
  <body>
    <div id="start-screen">
      <h1>SPALAM</h1>
      <p>WebAR Plane Detection</p>
      <button id="start-button">Start AR</button>
      <p id="start-status"></p>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <p>SPALAM を初期化中...</p>
      <p id="loading-detail"><small>カメラの使用を許可してください</small></p>
    </div>

    <script
      async
      src="https://docs.opencv.org/4.10.0/opencv.js"
      onload="onOpenCvReady();"
      type="text/javascript"
    ></script>
    <script type="module" src="/src/main.ts"></script>

    <script>
      // OpenCV読み込み完了のグローバル関数
      window.onOpenCvReady = function () {
        console.log("OpenCV.js is ready");
        window.cvReady = true;
      };

      // モバイルデバイスでのタッチ操作を最適化
      document.addEventListener(
        "touchstart",
        function (e) {
          // パフォーマンス向上のため、不要なタッチイベントを制御
        },
        { passive: true }
      );
    </script>
  </body>
</html>
